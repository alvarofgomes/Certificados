name: Notify portfolio of certificate changes

on:
  push:
    branches: [main]
    paths:
      - "certificados.json"
      - "**.pdf"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch sync event to portfolio repo
        run: |
          curl -sf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/alvarofgomes/Portfolio_alvarofgomes/dispatches \
            -d '{"event_type":"certificados-updated"}'
